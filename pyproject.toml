[project]
name = "streamstats"
version = "0.1.0"
description = "Потоковый анализатор событий"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamstats"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
patch = ["subprocess"]
